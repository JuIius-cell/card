<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Для Анюты 💖</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background: linear-gradient(135deg, #ff758c, #ff7eb3);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
            text-align: center;
            padding: 20px;
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        .card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(12px);
            border-radius: 24px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            max-width: 320px;
            width: 100%;
            box-sizing: border-box;
            animation: fadeIn 0.5s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
        input {
            width: 100%;
            padding: 14px;
            border-radius: 25px;
            border: none;
            outline: none;
            text-align: center;
            font-size: 16px;
            margin-top: 15px;
            background: rgba(255, 255, 255, 0.9);
            color: #333;
            box-sizing: border-box;
        }
        button {
            background: #fff;
            color: #ff477e;
            border: none;
            padding: 12px 25px;
            border-radius: 25px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
            width: 100%;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            transition: 0.2s;
        }
        button:active {
            transform: scale(0.95);
        }
        .hidden {
            display: none !important;
        }
        .heart {
            font-size: 60px;
            animation: pulse 1s infinite alternate;
            margin-bottom: 10px;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            100% { transform: scale(1.2); }
        }
        h2 {
            margin-top: 0;
            font-size: 24px;
        }
        p {
            font-size: 16px;
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <!-- Шаг 1: Проверка имени -->
    <div class="card" id="step-name">
        <h2>Привет! 👋</h2>
        <p>Как тебя зовут?</p>
        <input type="text" id="nameInput" placeholder="Введи имя...">
        <button onclick="checkName()">Далее ✨</button>
    </div>

    <!-- Если имя не то -->
    <div class="card hidden" id="step-denied">
        <h2>⛔ Ошибка!</h2>
        <p>Иди нафик, я ищу Аню! 🦝</p>
    </div>

    <!-- Шаг 2: Главный вопрос из TikTok -->
    <div class="card hidden" id="step-question">
        <h2>Секретный вопрос 🌸</h2>
        <p>Я хочу спросить, ценишь ли ты меня?</p>
        <button onclick="nextStep()">Да 💖</button>
        <button onclick="nextStep()">Да (но очень сильно) 🥰</button>
    </div>

    <!-- Шаг 3: Финал с сердечком -->
    <div class="card hidden" id="step-love">
        <div class="heart">💖</div>
        <h2>И я тебя очень ценю!</h2>
        <p>Ты у меня самая лучшая! ✨</p>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand(); // Разворачиваем на весь экран

        function checkName() {
            let name = document.getElementById('nameInput').value.trim().toLowerCase();
            let validNames = ['аня', 'анна', 'анька', 'анюта', 'аннушка'];

            if (validNames.includes(name)) {
                document.getElementById('step-name').classList.add('hidden');
                document.getElementById('step-question').classList.remove('hidden');
            } else {
                document.getElementById('step-name').classList.add('hidden');
                document.getElementById('step-denied').classList.remove('hidden');
            }

            if (tg.HapticFeedback) {
                tg.HapticFeedback.impactOccurred('medium');
            }
        }

        function nextStep() {
            document.getElementById('step-question').classList.add('hidden');
            document.getElementById('step-love').classList.remove('hidden');
            
            if (tg.HapticFeedback) {
                tg.HapticFeedback.notificationOccurred('success');
            }
        }
    </script>
</body>
</html>
